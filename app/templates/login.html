{% extends 'base.html' %}{% block title %}Anmelden · Anthias Hub{% endblock %}
{% block content %}<div class="login card"><h1>Willkommen zurück</h1><p class="muted">IT verwaltet Geräte. Marketing verwaltet die Playlists.</p>
<form method="post" action="{{ url_for('login') }}"><input type="hidden" name="csrf" value="{{ csrf() }}">
<label>Benutzername<input name="username" required autofocus autocomplete="username" maxlength="32"></label>
<label>Passwort<input name="password" type="password" required autocomplete="current-password"></label>
<button class="primary">Anmelden</button></form></div>{% endblock %}
